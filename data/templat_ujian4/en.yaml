  - 'Company Reg: {OCR_MY_SSM}. Name: {SYARIKAT}. Location: {BANDAR}. Note: SSM number may have OCR errors, please verify manually.'
  rider_ehailing:
  - Hi {NAMA}, your rider profile is pending. Please upload a clear photo of your MyKad front and back. Ensure the number {OCR_MY_NRIC} is fully visible and not blurred for verification.
  - 'To activate your delivery account with {SYARIKAT}, please complete the form below.

    Name: {NAMA}

    Phone: {MY_PHONE}

    Location: {BANDAR}

    Please submit by {TARIKH}.'
  - 'Payment processed to {NEG_AKAUN}. Reference: {NEG}. Thank you for riding with us.

    Support: {NEG_TEL} (24/7)'
