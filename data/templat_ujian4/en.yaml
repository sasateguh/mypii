  - 'SMS: Your {SYARIKAT} delivery failed. Call {NEG_TEL} to reschedule. Ref {NEG}.'
  - Dear {NAMA}, your {SYARIKAT} membership ID {NEG12_TANPA} is pending. Click here to activate.
