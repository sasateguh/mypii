    - "Item {NEG_KOD} was faulty, receipt {NEG_INVOIS} dated {TARIKH}."
  klinik:
    - "Patient {NAMA}, NRIC {MY_NRIC}, presented with fever. Next of kin reachable at {MY_PHONE}."
    - "MRN {NEG}, follow-up on {TARIKH} at {BANDAR} clinic."
