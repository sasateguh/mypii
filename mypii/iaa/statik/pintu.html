<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#E6ECEA">
<title>{{ms.judul}} · {{en.judul}}</title>
<link rel="stylesheet" href="/statik/app.css">
<link rel="stylesheet" href="/statik/pintu.css">
</head>
<body class="pintu" data-pintu>
<main class="pintu-utama">
  <svg class="pintu-ikon" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false">
    <rect x="6" y="9" width="36" height="25" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M15 34v7l8-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="18.5" y="20" width="11" height="9" rx="2" fill="currentColor"/>
    <path d="M20.5 20v-2.5a3.5 3.5 0 0 1 7 0V20" fill="none" stroke="currentColor" stroke-width="2.2"/>
  </svg>
  <section class="pintu-kad" lang="ms">
    <h1>{{ms.judul}}</h1>
    <p class="pintu-utama-teks">{{ms.pintu_utama}}</p>
    <p>{{ms.pintu_langkah}}</p>
    <p class="pintu-lembut">{{ms.pintu_simpan}}</p>
    <p class="pintu-lembut">{{ms.pintu_bantuan}}</p>
  </section>
  <section class="pintu-kad pintu-kad-kedua" lang="en">
    <h2>{{en.judul}}</h2>
    <p class="pintu-utama-teks">{{en.pintu_utama}}</p>
    <p>{{en.pintu_langkah}}</p>
    <p class="pintu-lembut">{{en.pintu_simpan}}</p>
    <p class="pintu-lembut">{{en.pintu_bantuan}}</p>
  </section>
</main>
</body>
</html>
